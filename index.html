<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HostelCare - Student Residence & Assistance Management Portal</title>
  <meta name="description" content="A simple, modern Hostel Management System built with React for student room maintenance, food/mess concerns, water facilities, and AC issues." />

  <!-- Google Fonts: Poppins for clean, modern & professional typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- React 18 & ReactDOM 18 from highly reliable Cloudflare/cdnjs CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
</head>
<body>
  <!-- Root Container for React App -->
  <div id="root">
    <!-- Initial Loading State -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Poppins', sans-serif; color: #4f46e5;">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem; animation: pulse 1.5s infinite;">🏨</div>
      <h2 style="font-size: 1.25rem; font-weight: 700;">Loading HostelCare Portal...</h2>
      <p style="color: #64748b; font-size: 0.9rem; margin-top: 0.25rem;">Preparing student assistance dashboard</p>
    </div>
  </div>

  <noscript>
    <div style="padding: 2rem; text-align: center; color: red;">
      JavaScript is required to run the HostelCare Student Portal. Please enable JavaScript in your browser settings.
    </div>
  </noscript>

  <!-- Error diagnostic helper -->
  <script>
    window.addEventListener('error', function(e) {
      console.error('Captured Frontend Error:', e);
      var rootEl = document.getElementById('root');
      if (rootEl && rootEl.innerHTML.includes('Loading HostelCare Portal')) {
        rootEl.innerHTML = '<div style="padding: 2rem; max-width: 600px; margin: 3rem auto; font-family: sans-serif; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 8px; color: #9f1239;">' +
          '<h3 style="margin-top:0;">⚠️ UI Loading Error</h3>' +
          '<p>' + (e.message || (e.target && e.target.src ? 'Failed to load script: ' + e.target.src : 'Script loading error')) + '</p>' +
          '<button onclick="location.reload()" style="background:#e11d48; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;">Reload Portal</button>' +
          '</div>';
      }
    }, true);
  </script>

  <!-- React 18 Application Script with cache busting -->
  <script src="app.compiled.js?v=2" onerror="document.getElementById('root').innerHTML='<div style=\'padding:2rem;text-align:center;color:#b91c1c;font-family:sans-serif;\'><h3>Failed to load app.compiled.js</h3><p>Please check your browser connection or cache.</p></div>'"></script>
</body>
</html>
